[package]
name = "sanjeh"
version = "0.1.0"
description = "Measures for language learning: how hard an English line is to hear and to say, word levels, connected speech — with benchmarks to improve them"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
hear = ["dep:whisper-rs", "dep:hound"]

[dependencies]
flate2 = { workspace = true }
hound = { version = "3.5.1", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = { workspace = true }
whisper-rs = { version = "0.16.0", optional = true }
