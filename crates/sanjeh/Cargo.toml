[package]
name = "sanjeh"
version = "0.1.0"
description = "Measures for language learning: how hard an English line is to hear and to say, word levels, connected speech — with benchmarks to improve them"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flate2 = { workspace = true }
hound = "3.5.1"
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = { workspace = true }
whisper-rs = { version = "0.11", optional = true }
tokio = "1.53.3"
anyhow = "1.0.104"

[features]
hear = ["whisper-rs"]
whisper-rs = ["dep:whisper-rs"]
